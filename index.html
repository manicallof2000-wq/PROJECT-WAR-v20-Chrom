<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>City Drive — خرید و فروش ماشین</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Tahoma,Arial,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101820d9;border:1px solid #ffffff25;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}
#brand{position:absolute;top:14px;right:14px;font-weight:800;letter-spacing:.5px}
#stats{position:absolute;top:14px;left:14px;display:flex;gap:8px;align-items:center}
#speed{font-size:25px;font-weight:900;min-width:95px;text-align:center}
#speed small{font-size:11px;color:#b7c7d4}
#garageBtn,#cameraBtn,#sellBtn,#buyBtn{pointer-events:auto;border:0;border-radius:10px;padding:10px 13px;background:#f2b544;color:#17212a;font-weight:800}
#garage{display:none;pointer-events:auto;position:absolute;inset:0;background:#071018d9;align-items:center;justify-content:center;padding:16px}
#garageCard{width:min(560px,100%);max-height:85%;overflow:auto;background:#17232d;border:1px solid #ffffff25;border-radius:18px;padding:18px}
#garageCard h2{margin:0 0 8px}#cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}
.carCard{background:#263744;border-radius:12px;padding:12px;border:1px solid #ffffff20}
.carCard button{width:100%;margin-top:8px;padding:9px;border:0;border-radius:8px;font-weight:bold;background:#f2b544}
#closeGarage{float:left;background:#344653;color:white;border:0;border-radius:8px;padding:8px 12px}
#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:12px;color:#e6edf2;text-align:center;white-space:nowrap}
#mobile{position:fixed;bottom:24px;left:18px;right:18px;display:none;justify-content:space-between;pointer-events:none}
.pad{display:grid;grid-template-columns:55px 55px;gap:8px;pointer-events:auto}
.pad button,.pedals button{width:55px;height:55px;border:1px solid #ffffff50;border-radius:15px;background:#152633cc;color:white;font-size:20px;touch-action:none}
.pedals{display:flex;gap:8px;align-items:end;pointer-events:auto}
.pedals button{height:76px;min-width:72px;background:#198754;color:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 0 #105c38}.pedals .brake{background:#8e3434cc;box-shadow:0 4px 0 #5e2222}
@media(max-width:700px){#mobile{display:flex}#hint{bottom:104px}#stats{top:70px;left:10px}#brand{top:10px;right:10px}}
/* Landscape phone layout: keep driving controls visible and away from the center */
#mobile .pad{grid-template-columns:76px 76px;gap:10px}
#mobile .pad .steer{width:76px;height:76px;font-size:30px;background:#263b4acc;border:2px solid #ffffff80}
#mobile .pedals .accelerator{width:78px;min-width:78px;height:150px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;background:#198754eF;border:2px solid #ffffff90;border-radius:18px;font-size:19px}
#mobile .pedals .brake{width:76px;min-width:76px;height:76px;background:#a33d3dcc;font-size:17px}
@media (max-width:900px) and (orientation:landscape){
 #mobile{display:flex;position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));align-items:flex-end;z-index:20}
 .pad{grid-template-columns:62px 62px;gap:7px}
 .pad button,.pad .steer{width:62px;height:62px;border-radius:12px;font-size:24px}
 .pedals{gap:7px;align-items:flex-end}
 .pedals button{width:62px;min-width:62px;height:58px;border-radius:12px;font-size:14px}.pedals .accelerator{height:112px!important}
 #hint{display:none}
 #stats{top:8px;left:8px;gap:5px}
 #speed{font-size:18px;min-width:68px;padding:7px}
 #cameraBtn,#garageBtn{padding:8px;font-size:12px}
 #brand{top:8px;right:8px;padding:7px 10px;font-size:12px}
}
@media (max-height:420px) and (orientation:landscape){
 .pad button,.pad .steer{height:48px}.pedals button{height:44px}.pedals .accelerator{height:90px!important}
 #mobile{bottom:max(6px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="brand" class="panel">CITY DRIVE <span style="color:#f2b544">۳بعدی</span></div>
 <div id="stats"><div id="speed" class="panel">۰ <small>KM/H</small></div><button id="cameraBtn">تغییر دوربین</button><button id="garageBtn">گاراژ</button></div>
 <div id="hint" class="panel">گاز: W یا دکمه سبز · ترمز: Space · فرمان: A/D · دوربین: C</div>
 <div id="garage"><div id="garageCard"><button id="closeGarage">بستن ✕</button><h2>گاراژ و نمایشگاه</h2><p>موجودی: <b id="cash">۵۰۰۰۰</b> سکه</p><div id="cars"></div><p style="font-size:12px;color:#b8c6d0">خرید ماشین جدید یا فروش ماشین فعلی. پیشرفت روی همین دستگاه ذخیره می‌شود.</p></div></div>
</div>
<div id="mobile">
 <div class="pad"><button class="steer" data-key="ArrowLeft">◀</button><button class="steer" data-key="ArrowRight">▶</button></div>
 <div class="pedals"><button class="brake" data-key=" ">ترمز</button><button class="accelerator" data-key="w"><span>گاز</span><b>▲</b></button></div>
</div>

for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){
 if(Math.abs(x*42)<12||Math.abs(z*42)<12)continue;

   for(const side of [-1,1]){
    const win=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.45,.055),glass);
    win.position.set(bx+xx,yy,bz+side*(d/2+.035));scene.add(win);
    const sill=new THREE.Mesh(new THREE.BoxGeometry(1.5,.09,.12),frame);
    sill.position.set(bx+xx,yy-.78,bz+side*(d/2+.07));scene.add(sill);
   }
  }
 }
}
// trees and street lamps
for(let i=-8;i<=8;i++)for(const side of [-1,1]){
 const x=i*24,z=side*10;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.2,7),mat(0x705038));trunk.position.set(x,1.1,z);scene.add(trunk);
 const leafMat=mat(0x397b43,.92),leafLight=mat(0x4d914d,.9);
 for(const [dx,dy,dz,r,material] of [[0,3.25,0,1.8,leafMat],[-.85,3.05,.18,1.25,leafLight],[.82,3.12,-.12,1.3,leafMat],[0,4.15,.05,1.18,leafLight]]){

let owned=[0],selected=0,cash=50000,car=makeCar(catalog[0]);scene.add(car);car.position.set(0,0,4);
const keys={};let velocity=0,steer=0,cameraMode=0,garageOpen=false;
const speedEl=document.querySelector('#speed');
function updateGarage(){
 document.querySelector('#cash').textContent=Math.floor(cash).toLocaleString('fa-IR');
 const list=document.querySelector('#cars');list.innerHTML='';
 catalog.forEach((c,i)=>{const own=owned.includes(i);const el=document.createElement('div');el.className='carCard';el.innerHTML='<b>'+c.name+'</b><p>قدرت: '+c.speed+'</p><p>'+ (own?'خریداری شده':c.price.toLocaleString('fa-IR')+' سکه')+'</p><button>'+(own?(selected===i?'ماشین فعلی':'انتخاب'):'خرید')+'</button>';el.querySelector('button').onclick=()=>{if(own){selected=i;scene.remove(car);car=makeCar(catalog[i]);scene.add(car);car.position.set(0,0,4);velocity=0;updateGarage()}else if(cash>=c.price){cash-=c.price;owned.push(i);selected=i;scene.remove(car);car=makeCar(catalog[i]);scene.add(car);car.position.set(0,0,4);updateGarage()}else alert('سکه کافی نداری!')};list.appendChild(el)});

<script>

      }
      if(garage){
        ctx.fillStyle='#071018eF';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';ctx.font='bold 22px Tahoma';ctx.textAlign='center';ctx.fillText('گاراژ و نمایشگاه',w/2,65);ctx.font='16px Tahoma';ctx.fillText('موجودی: '+cash.toLocaleString('fa-IR')+' سکه',w/2,98);
        cars.forEach((c,i)=>{let yy=145+i*76;ctx.fillStyle='#263744';ctx.fillRect(w*.12,yy,w*.76,62);ctx.fillStyle='white';ctx.fillText(c[0]+' — '+(c[1]===0?'رایگان':c[1].toLocaleString('fa-IR')+' سکه'),w/2,yy+25);ctx.fillStyle='#f2b544';ctx.fillText('برای خرید/انتخاب روی این ردیف بزن',w/2,yy+48)});
        ctx.fillStyle='#f2b544';ctx.fillText('برای بازگشت، دکمه گاراژ را بزن',w/2,h-35);
      }
    }
    cv.addEventListener('click',e=>{if(!garage)return;let i=Math.floor((e.clientY-145)/76);if(i>=0&&i<cars.length){let c=cars[i];if(cash>=c[1]){cash-=c[1];carName=c[0];document.getElementById('cash').textContent=cash.toLocaleString('fa-IR')}}});
    function tick(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;if(!garage){if(keys['w']||keys['arrowup']||keys['shift'])speed=Math.min(34,speed+24*dt);else if(keys['s']||keys['arrowdown']||keys[' '])speed=Math.max(-8,speed-30*dt);else speed*=.97;if(keys['a']||keys['arrowleft'])angle-=dt;if(keys['d']||keys['arrowright'])angle+=dt;z+=speed*dt;x+=angle*speed*dt;}document.getElementById('speed').innerHTML=Math.round(Math.abs(speed)*3.6).toLocaleString('fa-IR')+' <small>KM/H</small>';draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
    const note=document.createElement('div');note.style.cssText='position:fixed;top:112px;left:50%;transform:translateX(-50%);background:#152633dd;color:white;padding:8px 12px;border-radius:10px;font:12px Tahoma;z-index:9';note.textContent='حالت سازگار فعال شد؛ برای کنترل از دکمه‌های روی صفحه استفاده کن.';document.body.appendChild(note);
  },3500);
})();
</script>
